<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="theme-color" content="#080c18" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="SecureShield uses AI to detect phishing URLs and scam messages in seconds, with clear risk explanations and downloadable reports."
    />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="SecureShield — AI Phishing & Scam Detection" />
    <meta
      property="og:description"
      content="Check before you click or reply. Scan suspicious links and messages instantly."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>SecureShield — AI Phishing &amp; Scam Detection</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('appTheme') || 'system';
          var dark =
            saved === 'dark' ||
            (saved === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dark' : 'light',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
