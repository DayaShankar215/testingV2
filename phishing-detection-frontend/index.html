<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="theme-color" content="#080c18" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="SecureShield uses AI to detect phishing URLs and scam messages in seconds, with clear risk explanations and downloadable reports."
    />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="SecureShield — AI Phishing & Scam Detection" />
    <meta
      property="og:description"
      content="Check before you click or reply. Scan suspicious links and messages instantly."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    />
    <title>SecureShield — AI Phishing &amp; Scam Detection</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('appTheme') || 'system';
          var dark =
            saved === 'dark' ||
            (saved === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'dark' : 'light',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="app-boot">
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <p class="app-boot-text">Loading SecureShield…</p>
      </div>
    </div>
    <style>
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        color: #6366f1;
      }
      .app-boot-spinner {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 4px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        animation: appBootSpin 0.85s linear infinite;
      }
      .app-boot-text {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      @keyframes appBootSpin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
